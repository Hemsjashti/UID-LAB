<!DOCTYPE html>
<html>
    <body>
        <h1>
            USER LOGIN 
        </h1>
        <div style="background-color:antiquewhite;float: left;">
            <h1 style="text-align: center;color:brown;">USER LOGIN PAGE</h1>
        <form action="login.html">
            <table  style="width: fit-content;font-size: 24px;font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" border="6" cellspacing="1" cellpadding="5">
                <tr>
                <td>
                    <label for="username">Username:</label>
                </td>
                <td>
                    <input type="text" id="username" name="username">
                </td>
                </tr>
                <tr>
                <td>
                    <label for="password">Password:</label>
                </td>
                <td>
                <input type="password" id="password" name="password">
                </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                    <input type="submit" value="Login">
                </tr>
            </table>
        </form>
        </div>
        <div style="background-color:antiquewhite;float: right;">
            <h1 style="text-align: center;color:brown;"> CAMPUS ADMISSION REGISTRATION</h1>
            <form action="registration.html">
                <table  style="width: fit-content;font-size: 24px;font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" border="6" cellspacing="1" cellpadding="5">
                    <tr>
                        <td>
                            <label for="name">FULL NAME</label>
                        </td>
                        <td>
                            <input type="text"id="name"name="fullname"></input>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="email">Email:</label>
                        </td>
                        <td>
                            <input type="email"id="email"name="email"></input>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="number">Phone Number</label>
                        </td>
                        <td>
                            <input type="number"id="number"name="number"></input>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="password">Password:</label>
                        </td>
                        <td>
                            <input type="password" id="password" name="password">
                        </td>
                    </tr>      
                    <tr>
                        <td colspan="2" align="center">
                        <input type="submit" value="Register">
                        </td>
                    </tr>
                </table>
            </form>
            </div>
        </body>
</html>

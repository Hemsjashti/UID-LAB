<!DOCTYPE html>
<html>
    <head>
        <title>css id</title>
        <style>
        #para1
        {
            font-size: 200%;
            text-align: center;
            color:blue;
        }
        #para2
        {
            font-size: 150%;
            text-align: right;
            color: black;
        }
        </style>
    </head>
    <body>
        <p>JASHTI HEMENDRA,AV.SC.U4CSE25116,CSE B</p>
        <h1 style="text-align: center;color:blue;">CSS ID EXAMPLE</h1>
        <p id="para1">This is an example of CSS ID selector.</p>
        <p id="para2">The CSS ID selector is used to style a specific element with a unique identifier.</p>
        <p>In this example, the paragraph with the ID "para1" is styled with a larger font size, centered text, and blue color.</p>
    </body>
</html>

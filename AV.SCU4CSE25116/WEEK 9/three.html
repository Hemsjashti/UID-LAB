<!DOCTYPE html>
<html>
    <head>
        <title>attendence check with while loop</title>
    </head>
    <body>
        <script>
       let attendence = 80;
         while(attendence<=100){
            document.write("Your attendence is " + attendence + ". You are eligible to attend the exam.");
            document.write("<br>");
            attendence++;
        }
        </script>
    </body>
</html>

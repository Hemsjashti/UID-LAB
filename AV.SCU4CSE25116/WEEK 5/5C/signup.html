<!DOCTYPE html>
<html>
    <head>
        <title>Amrita Vishwa Vidyapeetham - Sign Up</title>
    </head>
    <style>
        h1{
            text-align: center;
        }
        .signup{

            width: 400px;
            height: auto;
            margin: 0 auto;
            padding: 20px;
            box-shadow: 0px 0px 10px black;
            background-color: antiquewhite;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
    <body>
        <header>
            <h1>🕉️Amrita Vishwa Vidyapeetam🏫</h1>
        </header>
        <div class="signup">
            <h2>Sign Up Page</h2>
            <form>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <br><br>

                <button type="submit" onclick="alert('Signed Up Successfully! Click on Login')">
                    Sign Up
                </button>
            </form>
            <p>Already have an account? <a href="5c.html">Login here</a>.</p>
        </div>
    </body>
</html>

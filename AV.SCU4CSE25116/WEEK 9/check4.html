<!DOCTYPE html>
<html>
    <head>
        <title>checking for amgstrom number</title>
    </head>
    <body>
        <script>
            let number = 153;
            let sum = 0;
            let temp = number;
            while(temp > 0){
                let digit = temp % 10;
                sum += digit ** 3;
                temp = temp / 10;
            }
            if(sum === number){
                document.write("The number is an Armstrong number.");
            } else {
                document.write("The number is not an Armstrong number.");
            }
        </script>
    </body>
</html>

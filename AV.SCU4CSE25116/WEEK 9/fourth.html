<!DOCTYPE html>
<html>
    <head>
        <title>checking minor age with do while loop</title>
    </head>
    <body>
        <script>
            let age = 17;
            do{
                document.write("Your age is " + age + ". You are a minor.");
                document.write("<br>");
                age--;
            } while(age >=1);                                                                                    
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>checking a number is odd or even</title>
    </head>
    <body>
        <script>
            let number = 6;
            if(number % 2 === 0){
                document.write("The number is even.");
            } else {
                document.write("The number is odd.");
            }
        </script>
    </body>
</html>

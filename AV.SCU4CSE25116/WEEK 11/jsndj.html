<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Style Landing Page</title>

<style>
/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    line-height: 1.6;
    background: #fff;
    color: #111;
}

/* ===== NAVBAR ===== */
header {
    position: fixed;
    width: 100%;
    top: 0;
    background: white;
    border-bottom: 1px solid #eee;
    z-index: 1000;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
}

.logo {
    font-size: 1.5rem;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 30px;
}

.nav-links a {
    text-decoration: none;
    color: #111;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #0071e3;
}

.menu-toggle {
    display: none;
    font-size: 1.5rem;
    cursor: pointer;
}

/* ===== HERO ===== */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    flex-direction: column;
    padding: 20px;
    margin-top: 60px;
}

.hero h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 10px;
}

.hero p {
    font-size: 1.2rem;
    color: #555;
    margin-bottom: 20px;
}

.hero img {
    width: 300px;
    margin-top: 20px;
    animation: float 3s ease-in-out infinite;
}

/* Animation */
@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0); }
}

/* ===== SECTIONS ===== */
.section {
    padding: 80px 50px;
    text-align: center;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
    align-items: center;
}

.grid img {
    width: 100%;
    border-radius: 10px;
}

.grid div {
    text-align: left;
}

/* ===== BUTTON ===== */
.btn {
    display: inline-block;
    padding: 10px 20px;
    background: #0071e3;
    color: white;
    border-radius: 20px;
    text-decoration: none;
    margin-top: 15px;
    transition: 0.3s;
}

.btn:hover {
    background: #005bb5;
}

/* ===== FORM ===== */
form {
    max-width: 400px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input, textarea {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 10px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
}

/* ===== FOOTER ===== */
footer {
    text-align: center;
    padding: 20px;
    background: #f5f5f5;
    margin-top: 50px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background: white;
        flex-direction: column;
        width: 200px;
        display: none;
    }

    .nav-links.active {
        display: flex;
    }

    .menu-toggle {
        display: block;
    }
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
    <nav class="navbar">
        <div class="logo"></div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <div class="nav-links" id="navLinks">
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Contact</a>
        </div>
    </nav>
</header>

<!-- ===== HERO ===== -->
<section class="hero">
    <h1>iPhone Next</h1>
    <p>Experience the future. Today.</p>
    <a href="#" class="btn" onclick="buyNow()">Buy Now</a>
    <img src="https://via.placeholder.com/300" alt="Product">
</section>

<!-- ===== SECTION 1 ===== -->
<section class="section">
    <div class="grid">
        <div>
            <h2>Powerful Performance</h2>
            <p>Lightning-fast processor with seamless multitasking.</p>
        </div>
        <img src="https://via.placeholder.com/400">
    </div>
</section>

<!-- ===== SECTION 2 ===== -->
<section class="section">
    <div class="grid">
        <img src="https://via.placeholder.com/400">
        <div>
            <h2>Stunning Camera</h2>
            <p>Capture every detail with next-gen photography.</p>
        </div>
    </div>
</section>

<!-- ===== FORM SECTION ===== -->
<section class="section">
    <h2>Contact Us</h2>
    <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <textarea id="message" placeholder="Your Message" required></textarea>
        <button type="submit">Submit</button>
    </form>
</section>

<!-- ===== FOOTER ===== -->
<footer>
    <p>© 2026 Apple Style Landing Page</p>
</footer>

<script>
// ===== MENU TOGGLE =====
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}

// ===== BUTTON INTERACTION =====
function buyNow() {
    alert("Redirecting to purchase page...");
}

// ===== FORM VALIDATION =====
document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();

    if (name === "" || email === "") {
        alert("Please fill all fields!");
        return;
    }

    alert("Form submitted successfully!");
});
</script>

</body>
</html>

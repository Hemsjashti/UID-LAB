<!DOCTYPE html>
<head>
    <title>Checking for eligibility for voting</title>
</head>
<body>
    <h1>Checking for eligibility for voting</h1>
    <script>
        var age = 18;
        if (age > 18) {
            document.write("You are already eligible to vote.");
        } else if (age < 18) {
            window.alert("You are not eligible to vote.");
        }
        else if (age == 18) {
            console.log("Congratulations! You are now eligible to vote.");
        }
        else{
            document.write("Invalid input. Please enter a valid age.");
            }
    </script>

</body>

<!DOCTYPE html>
<html>
    <head>
        <title>printing even numbers</title>
    </head>
    <body style="font-size: large;">
        <script>
            let v = 0;
            for(v;v<=10;v++){
                document.write(v);
                document.write("<br>");
            }
        </script>
    </body>
</html>

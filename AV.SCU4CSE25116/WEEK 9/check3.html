<!DOCTYPE html>
<html>
    <head>
        <title>getting factorial</title>
    </head>
    <body>
        <script>
            let number = 5;
            let factorial = 1;
            for(let i=1; i<=number; i++){
                factorial *= i;
            }
            document.write("The factorial of " + number + " is " + factorial);
        </script>
    </body>
</html>

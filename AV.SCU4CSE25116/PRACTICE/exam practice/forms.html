<!DOCTYPE html>
<html>
    <head>
        <title>
            Forms
        </title>
    </head>
    <body style="background-color:antiquewhite;">
        <h1 style="text-align: center;">College Admission Registrtion</h1>
        <table border="1" cellspacing="1" cellpadding="10" align="center" style="background-color:white;">
            <tr>
                <th>Full Name</th>
                <td><input type="text" name="full_name" required></td>
            </tr>
            <tr>
                <th>Email</th>
                <td><input type="email" name="email" required></td>
            </tr>
            <tr>
                <th>Phone Number</th>
                <td><input type="tel" name="phone" pattern="[0-9](10)" required</td>
            </tr>
            <tr>
                <th>Date Of Birth</th>
                <td><input type="date" name="dob" required></td>
            </tr>
            <tr>
                <th>Gender</th>
                <td>
                    <input type="radio" name="gender" value="male">male
                    <input type="radio" name="gender" value="female">female
                    <input type="radio" name="gender" value="other">other
                </td>
            </tr>
            <tr>
                <th>Course</th>
                <td>
                    <select name="course" required>
                        <option value="">select a course</option>
                        <option value="cse">Computer Science Engg</option>
                        <option value="ece">Electronics And Communication Engg</option>
                        <option value="mech">Mechanical Engg</option>
                        <option value="civil">Civil Engg</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Hobbies</th>
                <td>
                    <input type="checkbox" name="hobbies">Sports
                    <input type="checkbox" name="hobbies">Music
                    <input type="checkbox" name="hobbies">Reading
                </td>
            </tr>
            <tr>
                <th> Upload certifactes</th>
                <td><input type="file" name="certificates" accept=".pdf,.doc,.docx"></td>
            </tr>
            <tr>
                <th>Address</th>
                <td><textarea name="address"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="submit" onclick="alert('Forms submitted successfully!')">Submit</button>
                    <button type="reset" onclick="alert('Forms reset successfully!')">Reset</button>
                </td>
            </tr>
        </table>
    </body>
</html>
